[package]
name = "shearslice_wasm"
version = "0.1.0"
edition = "2024"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "shearslice_wasm"
crate-type = ["cdylib"]

[dependencies]
shearslice_core = { path = "../shearslice_core", default-features = false }

log = { default-features = false, version = "0.4.29" }
serde = { version = "1.0.228", default-features = false, features = ["derive","alloc",] } # alloc is for no_std, derive is needed
console_error_panic_hook = "0.1"

# Wasm dependencies
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
wasm-logger = "0.2"
web-time = "1.1.0"
# getrandom = {version = "0.4.1", features = ["wasm_js"]}
image = {version = "0.25.9", default-features = false, features = ["png"]}
js-sys = { version = "0.3.90", default-features = false }
colorous = {version = "1.0.16", default-features = false }




[dev-dependencies]
rstest = "0.25.0"
wasm-bindgen-test = "0.3.34"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"

# Library-specific profile settings
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# wasm-pack specific settings
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory"]
